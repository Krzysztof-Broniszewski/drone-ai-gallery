<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808"><meta name="description" content="Portraits & Characters — AI-generated editorial portraits, fantasy characters and fashion-inspired visual art by Krzysztof Broniszewski.">
<title>Portraits & Characters | Krzysztof Broniszewski</title>
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="../components/navbar.css">
<style>
.portrait-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.portrait-item{padding:0;border:1px solid rgba(197,163,93,.25);background:#101010;cursor:pointer;text-align:left;color:#f0d89a;overflow:hidden;transition:border-color .2s,transform .2s}.portrait-item:hover{border-color:#c5a35d;transform:translateY(-3px)}.portrait-item img{display:block;width:100%;height:360px;object-fit:cover}.portrait-item span{display:block;padding:14px 16px;font:500 12px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase}.portrait-viewer{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;padding:65px 65px 48px}.portrait-viewer.is-open{display:flex}.portrait-viewer img{max-width:100%;max-height:100%;object-fit:contain}.portrait-viewer button{position:absolute;border:1px solid rgba(197,163,93,.5);background:#111;color:#f0d89a;cursor:pointer;font-size:30px;width:45px;height:45px}.portrait-close{top:15px;right:20px}.portrait-prev{left:12px;top:50%}.portrait-next{right:12px;top:50%}.portrait-counter{position:absolute;bottom:13px;color:#c5a35d;font:12px Montserrat,sans-serif;letter-spacing:.15em}@media(max-width:900px){.portrait-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.portrait-item img{height:300px}}@media(max-width:560px){.portrait-gallery{gap:12px}.portrait-item img{height:225px}.portrait-item span{font-size:10px;padding:10px}.portrait-viewer{padding:65px 43px 55px}.portrait-viewer button{width:36px;height:40px}}
</style>
</head>
<body>
<div id="shared-navbar"></div><script src="../components/navbar.js"></script>
<main><section class="page-hero"><div class="container"><span class="eyebrow">Portfolio / AI Art</span><h1>Portraits &amp; Characters</h1><p>AI-generated editorial portraits, imaginative characters and fashion-inspired visual storytelling.</p><div class="gold-rule"></div></div></section>
<section class="section"><div class="container"><div class="portrait-gallery" id="portrait-gallery">
<button class="portrait-item" type="button" data-index="0" aria-label="Open Golden Butterfly"><img src="assets/thumbs/01.webp" alt="Golden Butterfly — AI-generated portrait" loading="lazy" decoding="async"><span>Golden Butterfly</span></button>
<button class="portrait-item" type="button" data-index="1" aria-label="Open Violet Muse I"><img src="assets/thumbs/02.webp" alt="Violet Muse I — AI-generated portrait" loading="lazy" decoding="async"><span>Violet Muse I</span></button>
<button class="portrait-item" type="button" data-index="2" aria-label="Open Violet Muse II"><img src="assets/thumbs/03.webp" alt="Violet Muse II — AI-generated portrait" loading="lazy" decoding="async"><span>Violet Muse II</span></button>
<button class="portrait-item" type="button" data-index="3" aria-label="Open Violet Muse III"><img src="assets/thumbs/04.webp" alt="Violet Muse III — AI-generated portrait" loading="lazy" decoding="async"><span>Violet Muse III</span></button>
<button class="portrait-item" type="button" data-index="4" aria-label="Open Violet Muse IV"><img src="assets/thumbs/05.webp" alt="Violet Muse IV — AI-generated portrait" loading="lazy" decoding="async"><span>Violet Muse IV</span></button>
<button class="portrait-item" type="button" data-index="5" aria-label="Open Golden Gaze"><img src="assets/thumbs/06.webp" alt="Golden Gaze — AI-generated portrait" loading="lazy" decoding="async"><span>Golden Gaze</span></button>
<button class="portrait-item" type="button" data-index="6" aria-label="Open Classic Portrait"><img src="assets/thumbs/07.webp" alt="Classic Portrait — AI-generated portrait" loading="lazy" decoding="async"><span>Classic Portrait</span></button>
<button class="portrait-item" type="button" data-index="7" aria-label="Open Dark Elegance"><img src="assets/thumbs/08.webp" alt="Dark Elegance — AI-generated portrait" loading="lazy" decoding="async"><span>Dark Elegance</span></button>
<button class="portrait-item" type="button" data-index="8" aria-label="Open Crimson Empress"><img src="assets/thumbs/09.webp" alt="Crimson Empress — AI-generated portrait" loading="lazy" decoding="async"><span>Crimson Empress</span></button>
<button class="portrait-item" type="button" data-index="9" aria-label="Open Noir Portrait I"><img src="assets/thumbs/10.webp" alt="Noir Portrait I — AI-generated portrait" loading="lazy" decoding="async"><span>Noir Portrait I</span></button>
<button class="portrait-item" type="button" data-index="10" aria-label="Open Noir Portrait II"><img src="assets/thumbs/11.webp" alt="Noir Portrait II — AI-generated portrait" loading="lazy" decoding="async"><span>Noir Portrait II</span></button>
</div></div></section>
<div class="portrait-viewer" id="portrait-viewer" role="dialog" aria-modal="true" aria-label="Portrait preview" aria-hidden="true"><button type="button" class="portrait-close" aria-label="Close">×</button><button type="button" class="portrait-prev" aria-label="Previous">‹</button><img id="portrait-full" alt=""><button type="button" class="portrait-next" aria-label="Next">›</button><span class="portrait-counter" id="portrait-counter"></span></div></main>
<footer class="site-footer"><a class="footer-channel" href="https://www.youtube.com/channel/UCCAHD3K9D9tyEpvwcsluTtA" rel="noopener noreferrer" target="_blank"><img alt="King of Drone logo" src="../assets/king-of-drone-logo.svg"><span>KING OF DRONE <span aria-hidden="true">↗</span><small>YOUTUBE CHANNEL</small></span></a><span>© <span id="year"></span> KRZYSZTOF BRONISZEWSKI</span><span>CREATED WITH VISION · POWERED BY TECHNOLOGY</span></footer>
<script defer src="../site.js"></script>
<script>
(()=>{const gallery=document.getElementById('portrait-gallery'),viewer=document.getElementById('portrait-viewer'),img=document.getElementById('portrait-full'),counter=document.getElementById('portrait-counter'),items=[...gallery.querySelectorAll('.portrait-item')];let active=0;const show=i=>{active=(i+items.length)%items.length;img.src=`assets/full/${String(active+1).padStart(2,'0')}.webp`;img.alt=items[active].querySelector('img').alt;counter.textContent=`${active+1} / ${items.length}`;};const close=()=>{viewer.classList.remove('is-open');viewer.setAttribute('aria-hidden','true');img.removeAttribute('src');document.body.style.overflow='';items[active].focus();};items.forEach((item,i)=>item.addEventListener('click',()=>{show(i);viewer.classList.add('is-open');viewer.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';viewer.querySelector('.portrait-close').focus();}));viewer.querySelector('.portrait-close').addEventListener('click',close);viewer.querySelector('.portrait-prev').addEventListener('click',()=>show(active-1));viewer.querySelector('.portrait-next').addEventListener('click',()=>show(active+1));viewer.addEventListener('click',e=>{if(e.target===viewer)close();});document.addEventListener('keydown',e=>{if(!viewer.classList.contains('is-open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(active-1);if(e.key==='ArrowRight')show(active+1);});})();
</script>
</body></html>
